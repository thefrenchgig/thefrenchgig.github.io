<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin — The French Gig</title>

  <link rel="icon" type="image/svg+xml" href="../assets/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles/main.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body class="admin-body">
  <div class="container admin-container">
    <header class="admin-header">
      <a href="../index.html" class="brand">
        <img src="../assets/logo.svg" alt="" class="brand-logo" />
        <span class="brand-text">The French Gig</span>
      </a>
      <h1>Events admin</h1>
    </header>

    <!-- Login -->
    <section id="login-section" class="admin-card">
      <h2>Log in</h2>
      <p class="section-lede">Enter the shared admin password to manage upcoming events.</p>
      <form id="login-form" class="admin-form">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" name="password" required autocomplete="current-password" />
        <div class="admin-form-actions">
          <button type="submit" class="btn btn-primary">Log in</button>
        </div>
      </form>
      <p id="login-error" class="admin-message admin-message-error" hidden></p>
    </section>

    <!-- Dashboard -->
    <section id="dashboard-section" hidden>
      <div class="admin-row">
        <h2>Upcoming &amp; past events</h2>
        <button type="button" id="logout-btn" class="btn btn-ghost">Log out</button>
      </div>
      <p class="section-lede">Past events stay listed here for editing, but are hidden from the live site automatically.</p>

      <div id="events-list" class="admin-events-list"></div>

      <button type="button" id="add-event-btn" class="btn btn-primary">+ Add new event</button>

      <!-- Add/Edit form -->
      <form id="event-form" class="admin-card admin-form" hidden>
        <h3 id="event-form-title">Add new event</h3>

        <div class="admin-form-grid">
          <div>
            <label for="event-date">Date</label>
            <input type="date" id="event-date" required />
          </div>
          <div>
            <label for="event-time">Time</label>
            <input type="time" id="event-time" />
          </div>
        </div>

        <label for="event-title-input">Event title</label>
        <input type="text" id="event-title-input" placeholder="e.g. Frankreichfest" required />

        <label for="event-venue">Venue</label>
        <input type="text" id="event-venue" placeholder="e.g. StadtStrand Düsseldorf · Tonhallenufer" required />

        <label for="event-subtitle">Subtitle / genre tag</label>
        <input type="text" id="event-subtitle" placeholder="e.g. French Soul, Rock &amp; Pop" />

        <label for="event-description">Description</label>
        <textarea id="event-description" placeholder="Short description shown on the event card"></textarea>

        <label for="event-url">Event link (tickets / info page)</label>
        <input type="url" id="event-url" placeholder="https://..." required />

        <div class="admin-form-actions">
          <button type="submit" class="btn btn-primary">Save &amp; publish</button>
          <button type="button" id="cancel-event-btn" class="btn btn-ghost">Cancel</button>
          <p class="admin-hint"><span aria-hidden="true">●</span> Goes live in ~30-60s</p>
        </div>
      </form>

      <p id="save-status" class="admin-message" hidden></p>
    </section>
  </div>

  <script src="admin.js" defer></script>
</body>
</html>
